<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Muhendishane Toplulugu - Sosyal Medya Baglantilari">
    <title>Mühendishane Topluluğu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f7fa;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(99, 102, 241, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(139, 92, 246, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(59, 130, 246, 0.05) 0%, transparent 50%);
            animation: bgMove 15s ease-in-out infinite alternate;
            z-index: 0;
        }

        @keyframes bgMove {
            0% {
                transform: translate(0, 0) rotate(0deg);
            }

            100% {
                transform: translate(-30px, -20px) rotate(3deg);
            }
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: rgba(99, 102, 241, 0.2);
            animation: float linear infinite;
        }

        .particle:nth-child(1) {
            left: 10%;
            animation-duration: 12s;
            animation-delay: 0s
        }

        .particle:nth-child(2) {
            left: 25%;
            animation-duration: 15s;
            animation-delay: 2s
        }

        .particle:nth-child(3) {
            left: 40%;
            animation-duration: 10s;
            animation-delay: 4s
        }

        .particle:nth-child(4) {
            left: 55%;
            animation-duration: 18s;
            animation-delay: 1s
        }

        .particle:nth-child(5) {
            left: 70%;
            animation-duration: 13s;
            animation-delay: 3s
        }

        .particle:nth-child(6) {
            left: 85%;
            animation-duration: 16s;
            animation-delay: 5s
        }

        .particle:nth-child(7) {
            left: 15%;
            animation-duration: 14s;
            animation-delay: 6s
        }

        .particle:nth-child(8) {
            left: 60%;
            animation-duration: 11s;
            animation-delay: 7s
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0
            }

            10% {
                opacity: 1
            }

            90% {
                opacity: 1
            }

            100% {
                transform: translateY(-10vh) scale(1);
                opacity: 0
            }
        }

        .container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 50px;
            padding: 40px 20px;
            max-width: 600px;
            width: 100%;
        }

        .logo-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            animation: fadeInDown 1s ease-out;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        .logo-wrapper {
            position: relative;
            width: 240px;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-wrapper::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #6366f1, #8b5cf6, #3b82f6, #6366f1);
            z-index: -1;
        }

        .logo-wrapper::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #6366f1, #8b5cf6, #3b82f6, #6366f1);
            filter: blur(20px);
            opacity: 0.3;
            z-index: -2;
        }

        .logo-wrapper img {
            width: 230px;
            height: 170px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #f5f7fa;
            transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .logo-wrapper:hover img {
            transform: scale(1.05);
        }

        .community-name {
            text-align: center;
        }

        .community-name h1 {
            font-size: 1.6rem;
            font-weight: 800;
            background: linear-gradient(135deg, #1e1b4b 0%, #4f46e5 50%, #7c3aed 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.02em;
            line-height: 1.3;
        }

        .community-name p {
            font-size: 0.9rem;
            color: rgba(30, 27, 75, 0.45);
            font-weight: 500;
            margin-top: 8px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        .buttons-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            width: 100%;
            animation: fadeInUp 1s ease-out 0.3s both;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        .social-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            padding: 32px 20px;
            border-radius: 20px;
            text-decoration: none;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            cursor: pointer;
            border: 1px solid rgba(99, 102, 241, 0.1);
            background: #ffffff;
            box-shadow: 0 2px 16px rgba(99, 102, 241, 0.06);
        }

        .social-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 20px;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .social-btn:hover {
            transform: translateY(-6px);
            border-color: rgba(99, 102, 241, 0.2);
        }

        .social-btn:hover::before {
            opacity: 1;
        }

        .social-btn:active {
            transform: translateY(-2px) scale(0.98);
        }

        .btn-whatsapp {
            background: linear-gradient(145deg, rgba(37, 211, 102, 0.06) 0%, #ffffff 100%);
        }

        .btn-whatsapp::before {
            background: linear-gradient(145deg, rgba(37, 211, 102, 0.12) 0%, rgba(37, 211, 102, 0.02) 100%);
        }

        .btn-whatsapp:hover {
            box-shadow: 0 10px 40px rgba(37, 211, 102, 0.15), 0 0 0 1px rgba(37, 211, 102, 0.12);
        }

        .btn-whatsapp .icon-circle {
            background: linear-gradient(135deg, #25d366 0%, #128c7e 100%);
            box-shadow: 0 8px 24px rgba(37, 211, 102, 0.25);
        }

        .btn-instagram {
            background: linear-gradient(145deg, rgba(225, 48, 108, 0.06) 0%, #ffffff 100%);
        }

        .btn-instagram::before {
            background: linear-gradient(145deg, rgba(225, 48, 108, 0.12) 0%, rgba(131, 58, 180, 0.04) 100%);
        }

        .btn-instagram:hover {
            box-shadow: 0 10px 40px rgba(225, 48, 108, 0.15), 0 0 0 1px rgba(225, 48, 108, 0.12);
        }

        .btn-instagram .icon-circle {
            background: linear-gradient(135deg, #f58529 0%, #dd2a7b 40%, #8134af 80%, #515bd4 100%);
            box-shadow: 0 8px 24px rgba(225, 48, 108, 0.25);
        }

        .icon-circle {
            width: 64px;
            height: 64px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .social-btn:hover .icon-circle {
            transform: scale(1.1) rotate(-3deg);
        }

        .icon-circle svg {
            width: 32px;
            height: 32px;
            fill: white;
        }

        .btn-label {
            font-size: 0.95rem;
            font-weight: 600;
            color: rgba(30, 27, 75, 0.85);
            letter-spacing: 0.02em;
        }

        .btn-sublabel {
            font-size: 0.75rem;
            color: rgba(30, 27, 75, 0.4);
            font-weight: 500;
            margin-top: -8px;
        }

        .footer {
            animation: fadeInUp 1s ease-out 0.6s both;
            text-align: center;
        }

        .footer p {
            font-size: 0.75rem;
            color: rgba(30, 27, 75, 0.25);
            font-weight: 500;
        }

        @media(max-width:480px) {
            .container {
                gap: 36px;
                padding: 30px 16px
            }

            .logo-wrapper {
                width: 190px;
                height: 140px
            }

            .logo-wrapper img {
                width: 180px;
                height: 130px
            }

            .community-name h1 {
                font-size: 1.3rem
            }

            .buttons-section {
                gap: 14px
            }

            .social-btn {
                padding: 24px 16px
            }

            .icon-circle {
                width: 54px;
                height: 54px;
                border-radius: 15px
            }

            .icon-circle svg {
                width: 26px;
                height: 26px
            }
        }
    </style>
</head>
